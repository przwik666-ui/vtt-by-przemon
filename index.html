<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>VTT Ultimate - Discord Activity</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@discord/embedded-app-sdk@1.0.0/dist/index.umd.js"></script>
    <style>
        :root {
            --bg: #0f0f18;
            --surface: #181825;
            --panel: #1e1e30;
            --accent: #c0392b;
            --gold: #e8b84b;
            --text: #dde1f0;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'JetBrains Mono', monospace;
            color: var(--text);
            touch-action: none;
        }

        .toolbar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 55px;
            background: #111;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 101;
            gap: 10px;
            user-select: none;
        }

        .sidebar {
            position: absolute;
            left: 0; top: 55px; bottom: 0;
            width: 220px;
            background: var(--panel);
            border-right: 1px solid #333;
            z-index: 100;
            padding: 10px;
            overflow-y: auto;
        }

        .map-container {
            position: absolute;
            left: 220px; right: 0; top: 55px; bottom: 0;
            overflow: hidden;
            background: #000;
            cursor: crosshair;
        }

        body.player-mode .toolbar,
        body.player-mode .sidebar,
        body.player-mode .controls-box {
            display: none !important;
        }

        body.player-mode .map-container {
            left: 0; top: 0; height: 100vh;
        }

        #mapCanvas {
            position: absolute;
            transform-origin: 0 0;
            pointer-events: auto;
        }

        .map-item {
            padding: 8px;
            background: #252538;
            cursor: pointer;
            border-radius: 4px;
            font-size: 11px;
            margin-bottom: 5px;
            border: 1px solid transparent;
        }

        .map-item.active {
            border-color: var(--gold);
            background: #2d2d45;
        }

        .controls-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--gold);
            z-index: 100;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            user-select: none;
        }

        button {
            background: #252538;
            border: 1px solid #444;
            color: white;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
        }

        button:hover {
            background: var(--accent);
        }

        input[type="range"] {
            width: 160px;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <strong style="color:var(--gold)">VTT // DISCORD ACTIVITY</strong>
    <button onclick="document.getElementById('mapInput').click()">+ Mapy</button>
    <button onclick="document.getElementById('tokenInput').click()">+ Tokeny</button>
    <div style="flex:1"></div>
    <button onclick="exportSession()" style="color:#2ecc71">💾 ZAPISZ (.json)</button>
    <button onclick="document.getElementById('sessionInput').click()" style="color:#3498db">📂 WCZYTAJ (.json)</button>
    <button onclick="toggleMode()" id="modeBtn">Tryb: DM</button>
</div>

<div class="sidebar" id="mapList"></div>

<div class="map-container" id="viewport">
    <canvas id="mapCanvas"></canvas>
</div>

<div class="controls-box">
    <div>Siatka: 
        <select id="gridType" onchange="updateSettings()">
            <option value="square">Kwadrat</option>
            <option value="hex">Hex</option>
        </select>
    </div>
    <div>Rozmiar: <input type="range" id="gridSize" min="30" max="150" value="70" oninput="updateSettings()"></div>
    <div>Widoczność: <input type="range" id="gridAlpha" min="0" max="100" value="30" oninput="updateSettings()"></div>
    <div style="font-size:9px; color:var(--gold)">SHIFT+LPM: Miarka | PPM: Pointer</div>
</div>

<input type="file" id="mapInput" multiple style="display:none" onchange="handleMaps(this.files)">
<input type="file" id="tokenInput" multiple style="display:none" onchange="handleTokens(this.files)">
<input type="file" id="sessionInput" style="display:none" accept=".json" onchange="importSession(this)">

<script>
    const CLIENT_ID = "1498579538735529994"; 
    let discordSdk = null;

    // ==================== DISCORD SDK ====================
    async function initDiscord() {
        try {
            discordSdk = new DiscordSDK(CLIENT_ID);
            await discordSdk.ready();
            console.log("✅ Discord Embedded App SDK initialized successfully");
            
            // Na razie wyłączamy authorize – często powoduje problemy przy testach
            // Możesz odkomentować później, gdy aplikacja będzie gotowa
            /*
            const { code } = await discordSdk.commands.authorize({
                client_id: CLIENT_ID,
                response_type: "code",
                scope: ["identify", "guilds"],
            });
            console.log("Authorization code received");
            */
        } catch (error) {
            console.error("❌ Discord SDK Error:", error);
        }
    }

    // ==================== VTT LOGIKA ====================
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const viewport = document.getElementById('viewport');

    let maps = [];
    let activeMapIdx = -1;
    let zoom = 1;
    let mX = 0, mY = 0;
    let isGM = true;

    let isDraggingMap = false;
    let isDraggingToken = null;
    let rulerStart = null;
    let rulerEnd = null;
    let ping = null;

    function toggleMode() {
        isGM = !isGM;
        document.body.className = isGM ? "" : "player-mode";
        document.getElementById('modeBtn').innerText = isGM ? "Tryb: DM" : "Tryb: GRACZ";
    }

    function handleMaps(files) {
        for (let file of files) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    maps.push({
                        name: file.name,
                        img: img,
                        tokens: [],
                        gridSize: 70,
                        gridAlpha: 0.3,
                        gridType: 'square'
                    });
                    renderMapList();
                    if (activeMapIdx === -1) selectMap(0);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function handleTokens(files) {
        if (activeMapIdx === -1) return;
        for (let file of files) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    maps[activeMapIdx].tokens.push({
                        x: 150,
                        y: 150,
                        img: img,
                        fileName: file.name
                    });
                    draw();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function selectMap(idx) {
        activeMapIdx = idx;
        const m = maps[idx];
        document.getElementById('gridSize').value = m.gridSize;
        document.getElementById('gridAlpha').value = m.gridAlpha * 100;
        document.getElementById('gridType').value = m.gridType;
        renderMapList();
        draw();
    }

    function updateSettings() {
        if (activeMapIdx === -1) return;
        maps[activeMapIdx].gridSize = parseInt(document.getElementById('gridSize').value);
        maps[activeMapIdx].gridAlpha = document.getElementById('gridAlpha').value / 100;
        maps[activeMapIdx].gridType = document.getElementById('gridType').value;
        draw();
    }

    function getGridCenter(px, py, m) {
        if (m.gridType === 'square') {
            return {
                x: Math.floor(px / m.gridSize) * m.gridSize + m.gridSize / 2,
                y: Math.floor(py / m.gridSize) * m.gridSize + m.gridSize / 2
            };
        }
        // Hex grid - uproszczone (można rozbudować później)
        return { x: px, y: py };
    }

    function draw() {
        if (activeMapIdx === -1) return;
        const m = maps[activeMapIdx];

        canvas.width = m.img.width;
        canvas.height = m.img.height;

        ctx.drawImage(m.img, 0, 0);

        // Grid
        ctx.strokeStyle = `rgba(255,255,255,${m.gridAlpha})`;
        ctx.lineWidth = 1;

        if (m.gridType === 'square') {
            for (let x = 0; x <= canvas.width; x += m.gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += m.gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // Tokens
        m.tokens.forEach(t => {
            const s = m.gridSize * 0.8;
            ctx.save();
            ctx.beginPath();
            ctx.arc(t.x, t.y, s/2, 0, Math.PI*2);
            ctx.clip();
            ctx.drawImage(t.img, t.x - s/2, t.y - s/2, s, s);
            ctx.restore();

            ctx.strokeStyle = "#e8b84b";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(t.x, t.y, s/2, 0, Math.PI*2);
            ctx.stroke();
        });

        // Ruler
        if (rulerStart && rulerEnd) {
            ctx.strokeStyle = "yellow";
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 5]);
            ctx.beginPath();
            ctx.moveTo(rulerStart.x, rulerStart.y);
            ctx.lineTo(rulerEnd.x, rulerEnd.y);
            ctx.stroke();
            ctx.setLineDash([]);

            const distance = Math.hypot(rulerEnd.x - rulerStart.x, rulerEnd.y - rulerStart.y);
            const ft = Math.round((distance / m.gridSize) * 5);
            const txt = ft + " ft";

            ctx.fillStyle = "rgba(0,0,0,0.85)";
            ctx.font = "bold 22px Arial";
            const tw = ctx.measureText(txt).width;
            ctx.fillRect(rulerEnd.x + 10, rulerEnd.y - 45, tw + 20, 35);

            ctx.fillStyle = "white";
            ctx.fillText(txt, rulerEnd.x + 20, rulerEnd.y - 20);
        }

        // Ping
        if (ping) {
            ctx.strokeStyle = `rgba(255, 60, 60, ${ping.a})`;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(ping.x, ping.y, ping.r, 0, Math.PI * 2);
            ctx.stroke();
        }

        canvas.style.transform = `translate(${mX}px, ${mY}px) scale(${zoom})`;
    }

    // ==================== EVENTY ====================
    viewport.onmousedown = (e) => {
        if (activeMapIdx === -1) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) / zoom;
        const my = (e.clientY - rect.top) / zoom;

        if (e.shiftKey) {
            rulerStart = { x: mx, y: my };
        } 
        else if (e.button === 2) { // prawy przycisk
            startPing(mx, my);
        } 
        else {
            const m = maps[activeMapIdx];
            isDraggingToken = m.tokens.find(t => 
                Math.hypot(t.x - mx, t.y - my) < m.gridSize * 0.5
            );

            if (isDraggingToken && isGM) {
                // drag token
            } else {
                isDraggingMap = true;
            }
        }
    };

    window.onmousemove = (e) => {
        if (activeMapIdx === -1) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) / zoom;
        const my = (e.clientY - rect.top) / zoom;

        if (rulerStart) {
            rulerEnd = { x: mx, y: my };
            draw();
        } 
        else if (isDraggingToken && isGM) {
            isDraggingToken.x = mx;
            isDraggingToken.y = my;
            draw();
        } 
        else if (isDraggingMap) {
            mX += e.movementX;
            mY += e.movementY;
            draw();
        }
    };

    window.onmouseup = () => {
        if (isDraggingToken && isGM && activeMapIdx !== -1) {
            const m = maps[activeMapIdx];
            const center = getGridCenter(isDraggingToken.x, isDraggingToken.y, m);
            isDraggingToken.x = center.x;
            isDraggingToken.y = center.y;
        }

        isDraggingMap = false;
        isDraggingToken = null;
        rulerStart = null;
        rulerEnd = null;
        draw();
    };

    viewport.onwheel = (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        zoom *= factor;
        draw();
    };

    viewport.oncontextmenu = (e) => e.preventDefault();

    function startPing(x, y) {
        ping = { x, y, r: 15, a: 1 };
        const interval = setInterval(() => {
            ping.r += 4;
            ping.a -= 0.07;
            if (ping.a <= 0) {
                clearInterval(interval);
                ping = null;
            }
            draw();
        }, 25);
    }

    function renderMapList() {
        const list = document.getElementById('mapList');
        list.innerHTML = maps.map((m, i) => `
            <div class="map-item ${i === activeMapIdx ? 'active' : ''}" 
                 onclick="selectMap(${i})">
                ${m.name}
            </div>
        `).join('');
    }

    function exportSession() {
        const data = maps.map(m => ({
            name: m.name,
            gridSize: m.gridSize,
            gridAlpha: m.gridAlpha,
            gridType: m.gridType,
            tokens: m.tokens.map(t => ({ x: t.x, y: t.y, fileName: t.fileName }))
        }));

        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "vtt_session.json";
        a.click();
    }

    function importSession(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                // Prosta implementacja - można rozbudować
                console.log("Zaimportowano sesję:", data);
                alert("Import sesji jeszcze nie jest w pełni zaimplementowany.");
            } catch (err) {
                alert("Błąd podczas importu pliku JSON");
            }
        };
        reader.readAsText(input.files[0]);
    }

    // Debug kliknięć
    document.addEventListener('click', (e) => {
        console.log('Click →', e.target.tagName, e.target.id || e.target.className);
    }, true);

    // ==================== START ====================
    window.onload = () => {
        initDiscord().catch(console.error);
        console.log("VTT Ultimate loaded - test kliknięć powinien działać");
    };
</script>
</body>
</html>
